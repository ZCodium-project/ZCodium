# 上游审计定时任务：每天北京时间 09:00（UTC 01:00）检查 zai-org/ZCode 的新 commit。
# - 有新 commit：创建审计 issue（标题以【Audit-Official-Repo-Commit-YYYY-MM-DD】开头）并创建同步 PR，@SudoUserReal；
# - 没有新 commit：不创建任何 issue / PR（正常退出）。
# 增量基准记录在审计 issue 正文的「审计范围」行中；无历史 issue 时以 fork 分叉点（merge-base）为基准。
# 同时支持 workflow_dispatch 手动触发；带 test_* 参数时用于测试/补审。
name: upstream-audit

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      test_upstream_ref:
        description: "仅测试/补审用：替代 upstream/main 的 ref（例如 origin/test/upstream-audit-fixture）"
        required: false
        type: string
      test_base_sha:
        description: "仅测试/补审用：替代增量基准的 commit SHA"
        required: false
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # 供 action 内置 actions/cache 缓存 opencode 二进制
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/zai-org/ZCode.git
          git fetch upstream main --no-tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # GITHUB_TOKEN 模式下 action 不设置提交身份，这里显式配置
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure audit label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create upstream-audit --color 5319e7 --description "上游审计记录（自动生成）" || true

      - name: Run OpenCode upstream audit
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_UPSTREAM_REF: ${{ inputs.test_upstream_ref }}
          TEST_BASE_SHA: ${{ inputs.test_base_sha }}
        with:
          model: deepseek/deepseek-flash
          use_github_token: true
          share: false
          prompt: |
            你是 ZCodium 仓库的「上游审计机器人」。ZCodium 是 zai-org/ZCode（下称「上游」）的独立审计 fork，已移除官方监控与遥测，并逐提交审阅上游改动。
            你的任务：审计上游的新 commit，创建审计 issue，并创建 PR 把改动同步到本仓库。

            ## 环境（已就绪，直接用）
            - 本仓库：ZCodium-project/ZCodium，当前工作区是 main 的检出。
            - upstream remote 已配置并已 fetch，可直接引用 `upstream/main`。
            - `gh` CLI 已认证，可创建 issue / label / 评论 / PR，可查询历史。
            - git 提交身份已配置。

            ## 步骤 1：确定增量范围
            1. 查询历史审计 issue（含已关闭）：
               `gh issue list --repo ZCodium-project/ZCodium --label upstream-audit --state all --limit 20 --json number,title,body,createdAt`
               - 忽略标题里含 `[TEST]` 的 issue。
               - 取 createdAt 最新的一条，从正文中找「审计范围」行，格式：`审计范围：<起始SHA>..<结束SHA>`，取结束 SHA 作为增量基准。
               - 如果最新 issue 里没有该行，就继续往更早的找；都没有则走第 2 步。
            2. 如果没有可用基准：基准 SHA = `git merge-base origin/main upstream/main`（fork 分叉点）。
            3. 测试 / 补审参数（仅当环境变量非空时生效，正常定时运行时会为空）：
               - `TEST_BASE_SHA` 非空 → 用它替代基准 SHA。
               - `TEST_UPSTREAM_REF` 非空 → 用它替代下文所有 `upstream/main`（如 `origin/test/xxx`；如该 ref 不存在，先 `git fetch origin <分支名>`）。
               - 一旦使用了任一测试参数，所有产物标题末尾追加 ` [TEST]`。
            4. 列出待审计 commit：
               `git log --oneline --no-decorate <基准SHA>..<上游ref>`
               - 输出为空 ⇒ 上游没有新改动。立即结束：不创建 issue、不创建 PR、不修改任何文件、不新建分支，只输出「上游无新 commit，跳过」。
               - commit 超过 50 个时：只处理最旧的 50 个（即范围为 `<基准SHA>..<第 50 个 commit 的 SHA>`），并在 issue 中说明剩余数量、下次继续。

            ## 步骤 2：分析改动并做隐私审计
            对范围内每个 commit：用 `git show --stat <sha>`、`git show <sha>`，必要时读取完整文件，理解改动。
            - 把 commit 归并为「改动」（同一功能 / bug fix 的多个 commit 归为一组，文档、重构也可作为独立改动）。
            - 对每个改动做隐私审计，重点检查是否包含：
              1. 代码 / 文件 / 工作区上传（workspace snapshot、git 上传、包体上传等）
              2. 遥测 / 埋点 / 指标 / 日志上报（telemetry、OTLP、analytics、metric、trace、report 等）
              3. 向官方或第三方服务发送用户数据（账号、设备、环境、提示词、模型 API 记录等）
              4. 新增上报依赖，或把上报开关默认打开
              判断依据：diff 中的网络请求（fetch / axios / OTLP exporter / grpc）、新增依赖、上传相关函数与调用链；需要时读完整文件确认调用点是否真会上报。
            - 每个改动记录以下四项：
              - 类型：功能 / bug fix / 重构 / 文档 / 其他
              - commit：短 SHA + 标题（多个 commit 全部列出）
              - 说明：中文 2-4 句
              - 审计结论（跟在说明后面）：
                - 未发现问题：「已检查审计代码，未发现代码上传或遥测行为。」
                - 发现问题：必须使用红色警示块（GitHub 会渲染为红色），格式如下：
                  > [!CAUTION]
                  > **发现代码上传 / 遥测行为（已在同步 PR 中剥离）**
                  > - 原始行为：<文件、函数、具体做了什么>
                  > - 已剥离内容：<逐条写清楚剥离了什么>

            ## 步骤 3：创建审计 issue（仅在步骤 1 确有新 commit 时）
            - 标题：`【Audit-Official-Repo-Commit-<当天UTC日期 YYYY-MM-DD>】<一句话摘要>`；测试模式追加 ` [TEST]`。
              示例：【Audit-Official-Repo-Commit-2026-09-23】3 个改动，1 项含遥测已剥离
            - 正文先写入临时文件，再用 `gh issue create --repo ZCodium-project/ZCodium --label upstream-audit --title "<标题>" --body-file <文件>` 创建。
            - 正文模板（严格遵守，尤其「审计范围」行）：

              @SudoUserReal

              ## 上游审计报告

              - 上游仓库：https://github.com/zai-org/ZCode
              - 审计范围：`<起始SHA>..<结束SHA>`
              - 改动数量：N 项（M 个 commit）
              - 同步 PR：见下方评论

              ### 1. <改动标题>
              - **类型**：<类型>
              - **commit**：`<短SHA>` <标题>；`<短SHA>` <标题>
              - **说明**：<中文说明>
              - **审计结论**：已检查审计代码，未发现代码上传或遥测行为。

              ### 2. ...

              > 本 issue 由 upstream-audit 工作流自动创建。

              说明：`- **审计结论**：...` 一行在发现问题时替换为上面的红色警示块内容。
            - 记住 issue 编号。

            ## 步骤 4：创建同步 PR
            - 新建分支：`git checkout -b audit/upstream-<YYYY-MM-DD>`（测试模式用 `audit/test-<YYYY-MM-DD>`）。
            - 移植改动：
              - 优先 `git cherry-pick <sha>...`；冲突时按本仓库现状适配（品牌、包名、已移除的遥测代码保持移除）。
              - 含遥测 / 上传的改动：只移植功能部分，**剥离全部上报代码**。
              - 完全无法适配的改动：跳过，并在 PR 正文「未同步」里说明原因。
            - 验证（尽力执行；无法完成时如实写明原因，不要因此中断流程）：
              - `pnpm install --frozen-lockfile`
              - `pnpm typecheck`
              - `pnpm lint`
            - 提交并推送：`git push -u origin <分支名>`。
            - 创建 PR（正文先写入临时文件，用 `gh pr create --repo ZCodium-project/ZCodium --base main --head <分支名> --title "<标题>" --body-file <文件>`）：
              - 标题：`[上游同步] <YYYY-MM-DD>：<一句话摘要>`；测试模式追加 ` [TEST]`。
              - 正文模板：

                @SudoUserReal

                - 审计 issue：<issue 链接>
                - 审计范围：`<起始SHA>..<结束SHA>`
                - 上游仓库：https://github.com/zai-org/ZCode

                ## 同步内容
                - <改动 1>（commit：...）
                - ...

                ## 剥离的遥测 / 上传行为
                - <逐条写清楚；没有则写「无」>

                ## 未同步
                - <逐条说明原因；没有则写「无」>

                ## 验证
                - pnpm typecheck：<结果>
                - pnpm lint：<结果>

                > 本 PR 由 upstream-audit 工作流自动创建，请人工审阅后合并。
            - 在审计 issue 下评论：`同步 PR：#<编号>`。
            - 收尾：确保 `git status --porcelain` 为空（所有改动已提交并推送）。

            ## 硬性约束
            - 没有新 commit：绝不创建 issue 或 PR。
            - 保持本仓库「无遥测、无上传」立场，不同步任何上报代码。
            - issue、PR 都保留：不要关闭、不要合并、不要删除。
            - issue 与 PR 正文都必须 @SudoUserReal。
            - 不要把任何密钥写进 issue / PR / 提交。
