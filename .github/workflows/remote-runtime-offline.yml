name: Remote runtime offline SSH

on:
  pull_request:
    paths:
      - "packages/desktop/src/host/sourceServerReleaseResolver.ts"
      - "packages/desktop/test/sourceServerOfflineSsh.integration.test.ts"
      - ".github/workflows/remote-runtime-offline.yml"
  workflow_dispatch:
    inputs:
      public_release:
        description: "额外从当前版本 GitHub Release 下载并验证（版本发布后使用）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-offline-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage current-version Linux runtime
        env:
          ZCODE_ENV: production
        run: pnpm prepare:remote-assets:linux
      - name: Start an isolated loopback SSH server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          # RUNNER_TEMP 的父目录不保证其他 UID 可遍历，不能作为独立 SSH 用户的 HOME。
          root="/var/tmp/zcodium-offline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root/home" "$root/release"
          echo "ZCODIUM_TEST_SSH_ROOT=$root" >> "$GITHUB_ENV"
          # CI runner 账号可能被 shadow 锁定，UsePAM=no 会连公钥也拒绝；使用独立、可登录的测试用户。
          # 仅绑定 loopback 且彻底禁用密码认证，不修改 runner 的账号或真实 SSH 配置。
          ssh_user=zcodium_offline
          sudo useradd -U -d "$root/home" -s /bin/bash "$ssh_user"
          sudo passwd -d "$ssh_user" >/dev/null
          chmod 755 "$root"
          sudo chown "$ssh_user:$ssh_user" "$root/home"
          ssh-keygen -q -t ed25519 -N '' -f "$root/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$root/client_key"
          cp "$root/client_key.pub" "$root/authorized_keys"
          chmod 644 "$root/authorized_keys"
          version=$(node -p 'require("./package.json").version')
          cp "packages/desktop/mock-cdn/releases/$version/source-server-release.json" "$root/release/"
          cp "packages/desktop/mock-cdn/releases/$version/zcode-server-linux-x64.tar.gz" "$root/release/"
          cat > "$root/sshd_config" <<EOF
          Port 24268
          ListenAddress 127.0.0.1
          HostKey $root/host_key
          PidFile $root/sshd.pid
          AuthorizedKeysFile $root/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          AllowUsers $ssh_user
          Subsystem sftp internal-sftp
          SetEnv HOME=$root/home ZCODIUM_DATA_BASE_DIR=$root/home ZCODE_SERVER_SKIP_SERVICE_REGISTRATION=1
          EOF
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f "$root/sshd_config"
          sudo /usr/sbin/sshd -E "$root/sshd.log" -f "$root/sshd_config"
          # 先用系统 OpenSSH 检查测试基础设施，避免把 sshd 账号/权限错误误判成应用问题。
          ssh -F /dev/null -i "$root/client_key" -p 24268 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$root/known_hosts" "$ssh_user@127.0.0.1" 'printf "isolated-sshd-ready\n"'
          echo "ZCODIUM_TEST_SSH_USER=$ssh_user" >> "$GITHUB_ENV"
          echo "ZCODIUM_TEST_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify real SSH upload, installation, handshake and reconnect with resource fetch forbidden
        env:
          ZCODIUM_TEST_PUBLIC_RELEASE: ${{ inputs.public_release && '1' || '' }}
        run: pnpm exec vitest run packages/desktop/test/sourceServerOfflineSsh.integration.test.ts
      - name: Stop isolated SSH server
        if: always()
        shell: bash
        run: |
          root="/var/tmp/zcodium-offline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -f "$root/sshd.log" ]; then
            sudo tail -n 50 "$root/sshd.log"
          fi
          if [ -f "$root/sshd.pid" ]; then
            sudo kill "$(cat "$root/sshd.pid")" || true
          fi
          if id zcodium_offline >/dev/null 2>&1; then
            sudo pkill -u zcodium_offline || true
            sudo userdel zcodium_offline || true
          fi
          sudo rm -rf "$root"
