# 在 issue / PR 评论中输入 /oc 或 /opencode 触发 OpenCode。
# 仅仓库协作者（OWNER/MEMBER/COLLABORATOR）的评论会启动工作流，action 内部还会再做一次 admin/write 权限校验。
# 使用 GITHUB_TOKEN 模式（无需安装 OpenCode GitHub App），评论与 PR 均以 github-actions[bot] 身份发出。
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # GITHUB_TOKEN 模式下 action 不会自行配置 git 凭据，依赖 checkout 默认保留凭据（persist-credentials: true）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # GITHUB_TOKEN 模式下 action 不设置提交身份，这里显式配置以便 OpenCode 提交改动
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: deepseek/deepseek-flash
          use_github_token: true
          share: false
