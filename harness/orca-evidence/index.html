<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>OrcaRouter GUI evidence</title>

    <script type="module" src="./main.tsx"></script>
  </body>
